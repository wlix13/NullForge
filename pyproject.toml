[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "nullforge"
description = "Forge the server's baseline from null"
readme = "README.md"
maintainers = [ { name = "wlix13", email = "github@wlix13.dev" } ]
authors = [ { name = "wlix13", email = "github@wlix13.dev" } ]
requires-python = ">=3.13,<3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
  "click",
  "pydantic",
  "pyinfra",
  "rich",
  "rich-click",
]
scripts.nullforge = "nullforge.cli.__main__:main"

[dependency-groups]
dev = [
  "deptry",
  "import-linter",
  "poethepoet",
  "prek",
  "ruff",
  "ty",
]
tests = [ "pytest", "pytest-cov", "pytest-sugar" ]

[tool.hatch]
version.path = "nullforge/__init__.py"
metadata.allow-direct-references = true
build.targets.wheel.packages = [ "nullforge" ]

[tool.ruff]
line-length = 120
lint.select = [ "E", "F", "I", "N", "S", "UP", "W", "YTT" ]
lint.ignore = [
  "N818", # Domain errors are named by failure mode, not with an -Error suffix
  "S108", # Probable insecure usage of temporary file or directory
]
lint.per-file-ignores."tests/*" = [
  "S101", # Use of `assert` detected
  "S104", # Possible binding to all interfaces
  "S105", # Hardcoded password string
  "S106", # Hardcoded password argument
]
lint.isort.lines-after-imports = 2

[tool.ty]
environment.root = [ "./nullforge" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-ra -q --tb=short --cov=nullforge --strict-markers"

[tool.poe]
tasks.format = "uv run ruff format ."
tasks.check-format = "uv run ruff format --check ."
tasks.lint = "uv run ruff check ."
tasks.typecheck = "uv run --group dev --group tests ty check"
tasks.check = [ "check-format", "lint", "typecheck" ]
tasks.tests = "uv run --group tests pytest"
